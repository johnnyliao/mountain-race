<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>晴天山路兜風</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas; sticker-style HUD pinned to the corners; lobby floats over a slow flyover of the valley */
:root{
  --sky:#5fb3ee; --papaya:#ff7a00; --navy:#0b2a5b; --dora:#1ea5ec;
  --cream:#fffaf0; --grass:#4f9a3a; --ink:#0b2a5b; --shade:rgba(11,42,91,.28);
  --f-display:'Baloo 2','PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-body:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-body)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;touch-action:none}
#game canvas{display:block;width:100%;height:100%}
.sticker{background:var(--cream);border:3px solid var(--navy);border-radius:16px;box-shadow:0 4px 0 var(--navy)}
button{font-family:var(--f-display);cursor:pointer;color:var(--navy)}
button:focus-visible{outline:3px solid var(--papaya);outline-offset:3px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#speed{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));padding:4px 14px 2px;display:flex;align-items:baseline;gap:6px}
#speed b{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
#speed span{font-family:var(--f-display);font-size:15px}
#speed.boost{background:#ffd43b}
#info{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(78px + env(safe-area-inset-top,0px));display:flex;gap:8px}
#info div{padding:2px 12px;font-family:var(--f-display);font-size:18px}
#rank.first{background:#ffd43b}
#mapwrap{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));padding:6px}
#minimap{display:block;width:120px;height:120px}
#music{pointer-events:auto;position:absolute;right:calc(150px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));font-size:15px;padding:6px 12px}
#viewBtn{pointer-events:auto;position:absolute;right:calc(150px + env(safe-area-inset-right,0px));top:calc(52px + env(safe-area-inset-top,0px));font-size:15px;padding:6px 12px}
#count{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;font-size:120px;color:#fff;-webkit-text-stroke:5px var(--navy);text-shadow:0 7px 0 var(--navy);pointer-events:none}
#count.pop{animation:pop .5s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1.8);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#toast{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:4px 14px;font-family:var(--f-display);font-size:17px}
/* rear-view mirror: top centre during races; the WebGL quad is drawn under this border-only frame */
#mirror{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(36vw,320px);height:calc(min(36vw,320px) / 3.2);border:5px solid var(--navy);border-radius:14px;box-shadow:0 4px 8px rgba(11,42,91,.35);pointer-events:none}
#hud.mirror-on #toast{top:calc(16px + env(safe-area-inset-top,0px) + min(36vw,320px) / 3.2)}
/* boost fx layers: above the 3D canvas, below HUD/controls */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#glow{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,170,0,0) 38%,rgba(255,120,0,.85) 100%)}

/* touch controls */
#controls{position:fixed;inset:0;pointer-events:none}
#steerZone{position:absolute;left:0;top:30%;bottom:0;width:45%;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.8);transform:translate(-50%,-50%);left:calc(110px + env(safe-area-inset-left,0px));bottom:0;top:auto}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:var(--cream);border:3px solid var(--navy);box-shadow:0 3px 0 var(--navy)}
#stick .arrow{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-size:26px;color:#fff;text-shadow:0 2px 0 var(--navy)}
#stick .l{left:8px} #stick .r{right:8px}
.pad{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:4px solid var(--navy);box-shadow:0 6px 0 var(--navy);font-family:var(--f-display);font-weight:800;display:grid;place-items:center;line-height:1.05;text-align:center}
.pad.on{transform:translateY(5px);box-shadow:0 1px 0 var(--navy)}
#gas{width:136px;height:136px;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));background:#4fd36a;font-size:28px}
#brake{width:76px;height:76px;right:calc(178px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));background:#ff6b6b;font-size:19px}
#hornBtn{width:66px;height:66px;right:calc(172px + env(safe-area-inset-right,0px));bottom:calc(116px + env(safe-area-inset-bottom,0px));background:#ffd43b;font-size:17px}
#driftBtn{width:70px;height:70px;right:calc(59px + env(safe-area-inset-right,0px));bottom:calc(170px + env(safe-area-inset-bottom,0px));background:#9b5de5;color:#fff;font-size:17px}

/* lobby + result */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(95,179,238,.15),rgba(11,42,91,.35))}
.panel{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:640px;width:100%}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vh,46px);line-height:1;color:#fff;-webkit-text-stroke:2px var(--navy);text-shadow:0 4px 0 var(--navy);text-wrap:balance;letter-spacing:.02em}
.netbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#netRow{gap:8px;flex-wrap:nowrap}
#codeIn{width:6.5em;font-family:var(--f-display);font-size:18px;padding:3px 8px;text-align:center;color:var(--navy);-webkit-user-select:text;user-select:text;box-shadow:0 3px 0 var(--navy)}
#status.code{font-family:var(--f-display);font-size:20px;background:#ffd43b}
#status{padding:4px 14px;font-size:15px;font-weight:600;text-align:center}
.cars{display:flex;gap:10px;width:100%}
.car{flex:1;min-width:0;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;background:var(--cream)}
.car svg{width:100%;max-width:220px;height:auto;max-height:22vh}
.car .name{font-family:var(--f-display);font-size:17px;line-height:1.1;white-space:nowrap}
.car .tag{position:absolute;top:-12px;right:10px;padding:0 10px;border-radius:10px;font-family:var(--f-display);font-size:15px;border:2px solid var(--navy)}
.car.mine{background:#fff3d6;border-color:var(--papaya);box-shadow:0 4px 0 var(--papaya)}
.car.mine .tag{background:var(--papaya);color:#fff}
.car.theirs{opacity:.62}
.car.theirs .tag{background:var(--dora);color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{font-size:22px;padding:6px 26px;background:#4fd36a}
.big:disabled{background:#cfd6df;color:#6b7a90;box-shadow:0 4px 0 #6b7a90;border-color:#6b7a90}
.alt{font-size:16px;padding:6px 16px}
.trk.sel,.lv.sel{background:#ffd43b}
#trackName,#lvName,#storyBadge{padding:2px 12px;font-family:var(--f-display);font-size:15px}
#result .panel{gap:12px}
#resTitle,#storyClear{font-size:clamp(32px,8vh,56px)}
#storyClear{padding:14px 24px;background:#ffd43b;text-align:center}
#resTimes{padding:8px 18px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;line-height:1.6}
/* story: chapter buttons; dialog = full-screen click layer with the sticker box at the bottom */
.chap{width:100%;max-width:600px;font-size:20px;padding:8px 16px}
#dialog{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));cursor:pointer;background:linear-gradient(180deg,rgba(11,42,91,0) 45%,rgba(11,42,91,.4))}
#dlgBox{width:100%;max-width:760px;padding:12px 22px;display:flex;flex-direction:column;gap:6px;min-height:150px}
#dlgSpeaker{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--papaya)}
#dlgText{font-size:22px;line-height:1.5}
#dlgHint{align-self:flex-end;font-size:14px;opacity:.55}
#dlgSkip{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:61;font-size:16px;padding:4px 14px}
#rotate{position:fixed;inset:0;background:var(--sky);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px}
#rotate .phone{width:70px;height:120px;border:6px solid var(--navy);border-radius:14px;background:var(--cream);animation:turn 1.6s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate p{font-family:var(--f-display);font-size:24px;margin:0}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
@media (max-height:420px){
  .panel{gap:7px} h1{font-size:28px}
  #speed b{font-size:36px} #gas{width:118px;height:118px;font-size:24px}
  #brake{right:calc(156px + env(safe-area-inset-right,0px))} #hornBtn{right:calc(150px + env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px))}
  #minimap{width:96px;height:96px} #music{right:calc(124px + env(safe-area-inset-right,0px))} #viewBtn{right:calc(124px + env(safe-area-inset-right,0px))}
  #driftBtn{right:calc(50px + env(safe-area-inset-right,0px));bottom:calc(152px + env(safe-area-inset-bottom,0px))}
  .car svg{max-height:18vh} #count{font-size:96px}
}
@media (prefers-reduced-motion:reduce){#count.pop,#rotate .phone{animation:none}}
</style>
</head>
<body>
<div id="game"></div>
<canvas id="fx"></canvas>
<div id="glow"></div>

<div id="hud" hidden>
  <div id="speed" class="sticker"><b id="kmh">0</b><span>km/h</span></div>
  <div id="info"><div id="lap" class="sticker">第 1/2 圈</div><div id="rank" class="sticker" hidden>第 1 名</div></div>
  <div id="mapwrap" class="sticker"><canvas id="minimap" width="240" height="240"></canvas></div>
  <button id="music" class="sticker" type="button">音樂 開</button>
  <button id="viewBtn" class="sticker" type="button">視角 追尾</button>
  <div id="toast" class="sticker" hidden></div>
  <div id="mirror" hidden></div>
  <div id="count" hidden></div>
</div>

<div id="controls" hidden>
  <div id="steerZone"><div id="stick"><span class="arrow l">◀</span><span class="arrow r">▶</span><div id="knob"></div></div></div>
  <div id="hornBtn" class="pad">叭叭</div>
  <div id="driftBtn" class="pad">甩尾</div>
  <div id="brake" class="pad">煞車</div>
  <div id="gas" class="pad">油門</div>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>晴天山路兜風</h1>
    <div class="row">
      <button id="modeStory" class="big sticker" type="button">📖 劇情模式</button>
      <button id="modeSolo" class="big sticker" type="button">🏁 單人練習</button>
      <button id="modeNet" class="big sticker" type="button">🌐 連線對戰</button>
    </div>
  </div>
</div>

<div id="storyMenu" class="overlay" hidden>
  <div class="panel">
    <h1>山路之王</h1>
    <span id="storyBadge" class="sticker" hidden>🏆 山路之王</span>
    <button id="stc-1" class="big sticker chap" type="button"></button>
    <button id="stc-2" class="big sticker chap" type="button"></button>
    <button id="stc-3" class="big sticker chap" type="button"></button>
    <button id="storyBackBtn" class="alt sticker" type="button">← 回主選單</button>
  </div>
</div>

<div id="lobby" class="overlay" hidden>
  <div class="panel">
    <h1>晴天山路兜風</h1>
    <div class="netbar">
      <div id="status" class="sticker">按「開房間」拿到房號，或輸入對方的房號</div>
      <div class="row" id="netRow">
        <button id="hostBtn" class="alt sticker" type="button">開房間</button>
        <input id="codeIn" class="sticker" type="tel" inputmode="numeric" maxlength="4" placeholder="輸入房號" autocomplete="off">
        <button id="joinBtn" class="alt sticker" type="button">加入</button>
      </div>
    </div>
    <div class="row" id="trackRow">
      <button id="trk-1" class="alt sticker trk" type="button">初級</button>
      <button id="trk-2" class="alt sticker trk" type="button">中級</button>
      <button id="trk-3" class="alt sticker trk" type="button">困難</button>
      <span id="trackName" class="sticker"></span>
    </div>
    <div class="cars">
      <button class="car sticker" id="pick-f1" type="button" data-car="f1">
        <span class="tag" hidden></span>
        <svg viewBox="0 0 220 80" aria-hidden="true">
          <rect x="18" y="20" width="12" height="30" rx="2" fill="#0b2a5b"/>
          <rect x="10" y="16" width="36" height="8" rx="2" fill="#0b2a5b"/>
          <path d="M28 52 L60 38 L96 36 L112 22 L132 22 L140 36 L196 44 L208 54 L204 58 L30 58 Z" fill="#ff7a00" stroke="#0b2a5b" stroke-width="3" stroke-linejoin="round"/>
          <path d="M60 46 L150 44 L196 50" stroke="#0b2a5b" stroke-width="6" fill="none" stroke-linecap="round"/>
          <circle cx="122" cy="26" r="8" fill="#fff" stroke="#0b2a5b" stroke-width="3"/>
          <rect x="186" y="56" width="30" height="6" rx="2" fill="#0b2a5b"/>
          <circle cx="52" cy="58" r="16" fill="#222" /><circle cx="52" cy="58" r="6" fill="#ff7a00"/>
          <circle cx="172" cy="60" r="13" fill="#222" /><circle cx="172" cy="60" r="5" fill="#ff7a00"/>
        </svg>
        <span class="name">橘藍 F1 賽車</span>
      </button>
      <button class="car sticker" id="pick-bug" type="button" data-car="bug">
        <span class="tag" hidden></span>
        <svg viewBox="0 0 220 80" aria-hidden="true">
          <path d="M22 60 C22 40 40 36 58 34 C70 10 140 6 158 32 C180 34 198 42 200 60 Z" fill="#1ea5ec" stroke="#0b2a5b" stroke-width="3" stroke-linejoin="round"/>
          <path d="M74 34 C84 18 132 14 146 33 Z" fill="#bfe9ff" stroke="#0b2a5b" stroke-width="3" stroke-linejoin="round"/>
          <line x1="110" y1="18" x2="110" y2="34" stroke="#0b2a5b" stroke-width="3"/>
          <circle cx="190" cy="46" r="6" fill="#fff" stroke="#0b2a5b" stroke-width="2"/>
          <rect x="16" y="56" width="190" height="6" rx="3" fill="#ddd" stroke="#0b2a5b" stroke-width="2"/>
          <circle cx="60" cy="60" r="15" fill="#222"/><circle cx="60" cy="60" r="7" fill="#fff"/>
          <circle cx="164" cy="60" r="15" fill="#222"/><circle cx="164" cy="60" r="7" fill="#fff"/>
        </svg>
        <span class="name">藍色金龜車</span>
      </button>
      <button class="car sticker" id="pick-sub" type="button" data-car="sub">
        <span class="tag" hidden></span>
        <svg viewBox="0 0 220 80" aria-hidden="true">
          <rect x="14" y="20" width="36" height="5" rx="2" fill="#0b2a5b"/>
          <path d="M22 25 L26 40 M46 25 L42 40" stroke="#0b2a5b" stroke-width="3" stroke-linecap="round"/>
          <path d="M26 56 L28 44 Q30 38 44 37 L70 33 Q88 16 122 16 Q150 16 162 31 L192 38 Q206 42 206 56 L204 60 L28 60 Z" fill="#1f4fa8" stroke="#0b2a5b" stroke-width="3" stroke-linejoin="round"/>
          <path d="M80 38 Q94 25 120 25 Q142 25 152 36 Z" fill="#bfe9ff" stroke="#0b2a5b" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="202" cy="47" r="4" fill="#fff" stroke="#0b2a5b" stroke-width="2"/>
          <circle cx="56" cy="58" r="15" fill="#222"/><circle cx="56" cy="58" r="8" fill="#e2b04a"/>
          <circle cx="164" cy="60" r="15" fill="#222"/><circle cx="164" cy="60" r="8" fill="#e2b04a"/>
        </svg>
        <span class="name">Subaru 22B</span>
      </button>
      <button class="car sticker" id="pick-gt500" type="button" data-car="gt500">
        <span class="tag" hidden></span>
        <svg viewBox="0 0 220 80" aria-hidden="true">
          <path d="M26 56 L28 44 Q30 38 44 37 L70 32 Q90 14 124 14 Q150 15 162 30 L192 38 Q206 42 206 56 L204 60 L28 60 Z" fill="#8f969c" stroke="#202024" stroke-width="3" stroke-linejoin="round"/>
          <path d="M44 40 L72 33 Q92 21 124 20 Q148 21 160 33 L192 40" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
          <path d="M44 47 L72 40 Q92 28 124 27 Q148 28 160 40 L192 46" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
          <path d="M80 38 Q96 28 124 28 Q146 28 156 38 Z" fill="#bfe9ff" stroke="#202024" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="200" cy="48" r="4" fill="#fff" stroke="#202024" stroke-width="2"/>
          <circle cx="56" cy="58" r="15" fill="#222"/><circle cx="56" cy="58" r="6" fill="#c8c8c8"/>
          <circle cx="172" cy="60" r="14" fill="#222"/><circle cx="172" cy="60" r="5" fill="#c8c8c8"/>
        </svg>
        <span class="name">灰色野馬 GT500</span>
      </button>
    </div>
    <div class="row" id="lvRow" hidden>
      <span id="lvName" class="sticker">電腦難度</span>
      <button id="lv-easy" class="alt sticker lv" type="button">簡單</button>
      <button id="lv-normal" class="alt sticker lv sel" type="button">普通</button>
      <button id="lv-hard" class="alt sticker lv" type="button">困難</button>
    </div>
    <div class="row">
      <button id="readyBtn" class="big sticker" type="button" disabled>先選一台車</button>
      <button id="soloBtn" class="alt sticker" type="button" disabled>自己開</button>
      <button id="aiBtn" class="alt sticker" type="button" disabled>跟電腦比</button>
      <button id="backMenuBtn" class="alt sticker" type="button">← 回主選單</button>
    </div>
    <div class="row" id="storyRow" hidden>
      <button id="storyGoBtn" class="big sticker" type="button" disabled>出發！</button>
      <button id="storyLobBtn" class="alt sticker" type="button">← 關卡選單</button>
    </div>
  </div>
</div>

<div id="result" class="overlay" hidden>
  <div class="panel">
    <h1 id="resTitle">抵達終點！</h1>
    <h1 id="storyClear" class="sticker" hidden>🏆 恭喜阿力成為「山路之王」！</h1>
    <div id="resTimes" class="sticker"></div>
    <button id="againBtn" class="big sticker" type="button">再玩一次</button>
    <button id="resMenuBtn" class="alt sticker" type="button">回主選單</button>
    <div class="row" id="storyResRow" hidden>
      <button id="storyNextBtn" class="big sticker" type="button">下一關 ▶</button>
      <button id="storyRetryBtn" class="big sticker" type="button">再試一次</button>
      <button id="storyChBtn" class="alt sticker" type="button">關卡選單</button>
      <button id="storyClearBtn" class="big sticker" type="button">回主選單</button>
    </div>
  </div>
</div>

<div id="dialog" hidden>
  <div id="dlgBox" class="sticker">
    <div id="dlgSpeaker"></div>
    <div id="dlgText"></div>
    <div id="dlgHint">▼ 點一下繼續</div>
  </div>
  <button id="dlgSkip" class="alt sticker" type="button">跳過 ▶▶</button>
</div>

<div id="rotate"><div class="phone"></div><p>請把手機轉成橫的</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    N: 1523, SC: 1.6, yScale: 1.3, CX: 0, CZ: 0, TW: 2352, lake: null, mountR: [880, 1160],
    vmaxKmh: 210, accelScale: 1.5, boostKmh: 300, boostAt: [0.15, 0.4, 0.65, 0.9], cars: 48, motos: 18, trafficKmh: { left: 100, right: 120 }, bgm: 'medium' }

const CX = TRACK.CX, CZ = TRACK.CZ, TW = TRACK.TW;

const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

/* ---------------- renderer & scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(innerWidth, innerHeight);
$('game').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 4000);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

(function sky() {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#3f97e0'); gr.addColorStop(0.55, '#8cc8f2'); gr.addColorStop(1, '#dff0fa');

const M = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
// player-car reflections: one procedural equirect environment (sky, sun, green ground), used only by the car materials
const CAR_ENV = (function carEnv() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#3f97e0'); gr.addColorStop(0.45, '#8cc8f2'); gr.addColorStop(0.5, '#dff0fa'); gr.addColorStop(0.56, '#9aa0a4'); gr.addColorStop(1, '#5f6669');

  g.fillStyle = sun; g.fillRect(100, 10, 100, 100);
  const tex = new THREE.CanvasTexture(c); tex.mapping = THREE.EquirectangularReflectionMapping;
  const pm = new THREE.PMREMGenerator(renderer); const env = pm.fromEquirectangular(tex).texture; pm.dispose(); tex.dispose();
  return env;
})();

/* ---------------- track ---------------- */
const ctrl = TRACK.ctrl;
const curve = new THREE.CatmullRomCurve3(ctrl.map(p => new THREE.Vector3(p[0] * SC, p[1] * TRACK.yScale, p[2] * SC)), true, 'centripetal');
const P = curve.getSpacedPoints(N).slice(0, N);
const T = [], L = [], D = [0];
for (let i = 0; i < N; i++) {
  const a = P[(i - 1 + N) % N], b = P[(i + 1) % N];
  const t = new THREE.Vector3().subVectors(b, a).normalize(); T.push(t);
  const l = new THREE.Vector3(t.z, 0, -t.x).normalize(); L.push(l);
  if (i > 0) D.push(D[i - 1] + P[i].distanceTo(P[i - 1]));
}
const TRACK_LEN = D[N - 1] + P[N - 1].distanceTo(P[0]);
const yawAt = i => Math.atan2(T[i].x, T[i].z);

function nearestIdx(x, z, from, win) {
  let best = 1e18, bi = 0;
  if (from == null) {
    for (let i = 0; i < N; i += 4) { const dx = x - P[i].x, dz = z - P[i].z, d = dx * dx + dz * dz; if (d < best) { best = d; bi = i; } }
    from = bi; win = 4;
  }
  for (let k = -win; k <= win; k++) { const i = (from + k + N) % N; const dx = x - P[i].x, dz = z - P[i].z, d = dx * dx + dz * dz; if (d < best) { best = d; bi = i; } }
  return { i: bi, d: Math.sqrt(best) };
}
function noise(x, z) {
  return Math.sin(x * 0.031) * Math.cos(z * 0.027) * 0.6 + Math.sin(x * 0.071 + z * 0.053) * 0.3 + Math.cos(x * 0.013 - z * 0.019) * 0.5;
}
function heightAt(x, z) {
  const n = nearestIdx(x, z);
  const y0 = P[n.i].y, t = ss(HALF + 3, HALF + 45, n.d);
  const lake = TRACK.lake ? 30 * Math.exp(-((x - LX) ** 2 + (z - LZ) ** 2) / (62 * SC * 62 * SC)) : 0;
  const r = Math.hypot(x - CX, z - CZ);
  const mount = ss(TRACK.mountR[0], TRACK.mountR[1], r) * 95;
  return { h: y0 - 0.35 + t * (noise(x, z) * 13 + 0.35 - lake + mount), d: n.d };
}

// road texture
function roadTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#5b5f66'; g.fillRect(0, 0, 256, 512);
  for (let k = 0; k < 2600; k++) { const v = 80 + Math.random() * 40 | 0; g.fillStyle = `rgb(${v},${v + 2},${v + 6})`; g.fillRect(Math.random() * 256, Math.random() * 512, 2, 2); }
  g.fillStyle = '#f4f4f4'; g.fillRect(8, 0, 9, 512); g.fillRect(239, 0, 9, 512);
  g.fillStyle = '#ffcf33'; g.fillRect(122, 0, 12, 256);
  const tx = new THREE.CanvasTexture(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  tx.anisotropy = renderer.capabilities.getMaxAnisotropy(); return tx;
}
(function buildRoad() {
  const pos = [], uv = [], idx = [], skirt = [], sIdx = [];
  for (let k = 0; k <= N; k++) {
    const i = k % N, p = P[i], l = L[i], v = (k === N ? TRACK_LEN : D[i]) / 18;
    pos.push(p.x + l.x * HALF, p.y + 0.03, p.z + l.z * HALF, p.x - l.x * HALF, p.y + 0.03, p.z - l.z * HALF);

    skirt.push(p.x + l.x * e, p.y + 0.02, p.z + l.z * e, p.x + l.x * e, p.y - 4, p.z + l.z * e,
               p.x - l.x * e, p.y + 0.02, p.z - l.z * e, p.x - l.x * e, p.y - 4, p.z - l.z * e);
    if (k < N) {
      const a = k * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      const s = k * 4; sIdx.push(s, s + 4, s + 1, s + 1, s + 4, s + 5, s + 2, s + 3, s + 6, s + 3, s + 7, s + 6);
    }

  sg.setAttribute('position', new THREE.Float32BufferAttribute(skirt, 3)); sg.setIndex(sIdx); sg.computeVertexNormals();
  scene.add(new THREE.Mesh(sg, M(0x8a7a5e, { side: THREE.DoubleSide })));

    const i = k % N, p = P[i], l = L[i];

// guardrails
(function rails() {
  const pos = [], idx = []; const e = HALF + 0.9;
  for (let k = 0; k <= N; k++) {
    const i = k % N, p = P[i], l = L[i];
    for (const s of [1, -1]) { const x = p.x + l.x * e * s, z = p.z + l.z * e * s; pos.push(x, p.y + 0.5, z, x, p.y + 0.85, z); }
    if (k < N) { const a = k * 4; idx.push(a, a + 4, a + 1, a + 1, a + 4, a + 5, a + 2, a + 3, a + 6, a + 3, a + 7, a + 6); }
  }

  scene.add(new THREE.Mesh(g, M(0xe8edf2, { side: THREE.DoubleSide })));

  posts.count = n; scene.add(posts);
})();

// start / goal arch
(function arch() {
  const i = 0, p = P[i], l = L[i], yaw = yawAt(i);
  const c = document.createElement('canvas'); c.width = 64; c.height = 64; const g = c.getContext('2d');
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g.fillStyle = (x + y) % 2 ? '#111' : '#fff'; g.fillRect(x * 8, y * 8, 8, 8); }
  const ct = new THREE.CanvasTexture(c); ct.magFilter = THREE.NearestFilter; ct.wrapS = ct.wrapT = THREE.RepeatWrapping; ct.repeat.set(HALF, 1);
  const strip = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, 2.4), M(0xffffff, { map: ct }));
  strip.rotation.order = 'YXZ'; strip.rotation.set(-Math.PI / 2, yaw, 0);
  strip.position.set(p.x, p.y + 0.06, p.z); scene.add(strip);
  const grp = new THREE.Group(); grp.position.copy(p); grp.rotation.y = yaw; scene.add(grp);
  for (const s of [1, -1]) { const post = new THREE.Mesh(new THREE.BoxGeometry(0.8, 7, 0.8), M(0xff7a00)); post.position.set(s * (HALF + 1.8), 3.5, 0); grp.add(post); }
  const bc = document.createElement('canvas'); bc.width = 512; bc.height = 96; const bg = bc.getContext('2d');
  bg.fillStyle = '#0b2a5b'; bg.fillRect(0, 0, 512, 96); bg.fillStyle = '#fff'; bg.font = '800 60px "Baloo 2", sans-serif'; bg.textAlign = 'center'; bg.textBaseline = 'middle';
  bg.fillText('START · GOAL', 256, 52);
  const banner = new THREE.Mesh(new THREE.BoxGeometry(HALF * 2 + 4.4, 1.7, 0.4), [M(0x0b2a5b), M(0x0b2a5b), M(0x0b2a5b), M(0x0b2a5b), M(0xffffff, { map: new THREE.CanvasTexture(bc) }), M(0xffffff, { map: new THREE.CanvasTexture(bc) })]);
  banner.position.set(0, 6.6, 0); grp.add(banner);

/* ---------------- terrain ---------------- */
let lakeLevel = null;
(function terrain() {
  const S = 230; const g = new THREE.PlaneGeometry(TW, TW, S, S); g.rotateX(-Math.PI / 2); g.translate(CX, 0, CZ);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  const hs = new Float32Array(pos.count), ds = new Float32Array(pos.count);
  for (let k = 0; k < pos.count; k++) { const r = heightAt(pos.getX(k), pos.getZ(k)); hs[k] = r.h; ds[k] = r.d; pos.setY(k, r.h); }
  // lake level: just below the lowest rim around the bowl
  if (TRACK.lake) {
    let rim = 1e9; for (let a = 0; a < 48; a++) { const ang = a / 48 * Math.PI * 2; rim = Math.min(rim, heightAt(LX + Math.cos(ang) * 70 * SC, LZ + Math.sin(ang) * 70 * SC).h); }
    const centre = heightAt(LX, LZ).h; if (rim - 1 > centre + 1.5) lakeLevel = rim - 1;
  }
  const c = new THREE.Color();
  for (let k = 0; k < pos.count; k++) {
    const x = pos.getX(k), z = pos.getZ(k), h = hs[k], d = ds[k];
    const v = noise(x * 2.3, z * 2.1) * 0.06;
    c.setRGB(0.36 + v, 0.62 + v, 0.27);
    if (h > 55) c.lerp(new THREE.Color(0.55, 0.58, 0.5), ss(55, 90, h));
    if (h > 95) c.lerp(new THREE.Color(0.97, 0.98, 1), ss(95, 110, h));
    if (lakeLevel !== null && h < lakeLevel + 1.2) c.setRGB(0.83, 0.77, 0.58);
    if (d < HALF + 4) c.setRGB(0.6, 0.53, 0.4);
    col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, M(0xffffff, { vertexColors: true })));
  const outer = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), M(0x5f9a48)); outer.rotation.x = -Math.PI / 2; outer.position.set(CX, -8, CZ); scene.add(outer);
  if (lakeLevel !== null) {
    const lake = new THREE.Mesh(new THREE.CircleGeometry(78 * SC, 48), new THREE.MeshPhongMaterial({ color: 0x3aa7d8, shininess: 90, specular: 0xffffff, transparent: true, opacity: 0.9 }));
    lake.rotation.x = -Math.PI / 2; lake.position.set(LX, lakeLevel, LZ); scene.add(lake);
  }
})();

// far mountains
(function mountains() {
  const rnd = mulberry(7);
  for (let k = 0; k < 18; k++) {
    const a = k / 18 * Math.PI * 2 + rnd() * 0.2, r = (640 + rnd() * 160) * SC, h = 190 + rnd() * 160, rad = (120 + rnd() * 90) * SC;
    const x = CX + Math.cos(a) * r, z = CZ + Math.sin(a) * r;
    const m = new THREE.Mesh(new THREE.ConeGeometry(rad, h, 9), M(new THREE.Color().setHSL(0.36 + rnd() * 0.08, 0.3, 0.38 + rnd() * 0.08)));
    m.position.set(x, h / 2 - 10, z); scene.add(m);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(rad * 0.28, h * 0.28, 9), M(0xffffff)); cap.position.set(x, h - 10 - h * 0.14 + 0.5, z); scene.add(cap);
  }
})();
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// trees
(function trees() {
  const rnd = mulberry(42), MAX = 2600;
  const pineF = new THREE.InstancedMesh(new THREE.ConeGeometry(2.3, 7, 7), M(0xffffff), MAX);
  const roundF = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.6, 1), M(0xffffff), MAX);
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.3, 0.4, 2.6, 6), M(0x7a5232), MAX * 2);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
  let np = 0, nr = 0, nt = 0;
  for (let k = 0; k < 9000 && np + nr < MAX; k++) {
    const x = CX + (rnd() - 0.5) * TW * 0.96, z = CZ + (rnd() - 0.5) * TW * 0.96;
    const r = heightAt(x, z); if (r.d < HALF + 5 || r.h > 80) continue;
    if (lakeLevel !== null && r.h < lakeLevel + 1.5) continue;
    if (r.d > 70 && rnd() < 0.45) continue;
    const sc = 0.75 + rnd() * 0.7;
    s.set(sc, sc, sc); p.set(x, r.h + 1.2 * sc, z); m.compose(p, q, s); trunks.setMatrixAt(nt++, m);
    const roll = rnd();
    if (roll < 0.62) {
      p.set(x, r.h + 5.4 * sc, z); m.compose(p, q, s); pineF.setMatrixAt(np, m);
      pineF.setColorAt(np++, c.setHSL(0.33 + rnd() * 0.05, 0.5, 0.24 + rnd() * 0.08));
    } else {
      p.set(x, r.h + 4 * sc, z); m.compose(p, q, s); roundF.setMatrixAt(nr, m);
      const pink = r.d < 45 && rnd() < 0.45;
      roundF.setColorAt(nr++, pink ? c.setHSL(0.93 + rnd() * 0.03, 0.75, 0.8) : c.setHSL(0.24 + rnd() * 0.08, 0.55, 0.36 + rnd() * 0.1));
    }
  }
  pineF.count = np; roundF.count = nr; trunks.count = nt;
  [pineF, roundF].forEach(o => { if (o.instanceColor) o.instanceColor.needsUpdate = true; });
  scene.add(pineF, roundF, trunks);
})();

// clouds
const clouds = [];
(function makeClouds() {
  const rnd = mulberry(3), mat = M(0xffffff, { emissive: 0x6b7f90 });
  for (let k = 0; k < 16; k++) {

mirrorQuadScene.add(new THREE.Mesh(mirrorGeo, mirrorMat));
let mirrorShown = false, mirrorBox = null;
function layoutMirror() {
  const b = mirrorEl.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.min(Math.round(b.width * dpr), 640);
  mirrorRT.setSize(w, Math.round(w * b.height / b.width));
  mirrorCam.aspect = mirrorRT.width / mirrorRT.height; mirrorCam.updateProjectionMatrix();
  mirrorMat.uniforms.size.value.set(b.width, b.height);
  mirrorBox = { x: b.left, y: b.top, w: b.width, h: b.height };
}
function setMirror(on) {
  if (on === mirrorShown) return;
  mirrorShown = on; mirrorEl.hidden = !on; hudEl.classList.toggle('mirror-on', on);
  if (on) layoutMirror();
}
addEventListener('resize', () => { if (mirrorShown) layoutMirror(); });
addEventListener('orientationchange', () => { if (mirrorShown) layoutMirror(); });
function renderMirror() {
  const fx = Math.sin(me.h), fz = Math.cos(me.h);
  mirrorCam.position.set(me.x + fx * 1.5, me.y + 3.2, me.z + fz * 1.5);
  mirrorCam.lookAt(me.x - fx * 30, me.y + 2.4, me.z - fz * 30);
  const own = CARS[G.pick].root, ownVis = own.visible; // a real mirror never shows the driver's own car
  own.visible = false;
  renderer.setRenderTarget(mirrorRT);
  renderer.render(scene, mirrorCam);
  renderer.setRenderTarget(null);
  own.visible = ownVis;
}
function drawMirror() {
  const b = mirrorBox, by = innerHeight - b.y - b.h; // viewport/scissor y is measured from the bottom
  renderer.setScissorTest(true);
  renderer.setViewport(b.x, by, b.w, b.h); renderer.setScissor(b.x, by, b.w, b.h);
  renderer.autoClear = false;
  renderer.render(mirrorQuadScene, mirrorQuadCam);
  renderer.autoClear = true;
  renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.setScissor(0, 0, innerWidth, innerHeight);
  renderer.setScissorTest(false);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  readInput();
  updateBoostFx(dt);
  clouds.forEach(c => { c.position.x += dt * 2.5; if (c.position.x > CX + 1100) c.position.x = CX - 1100; });
  if (AI.on && G.phase !== 'lobby') updateAI(now, dt);
  const op = readOpp(dt);

  // lobby: conflict + start checks
  if (G.phase === 'lobby') {
    const o = getOpp();
    if (o && o.presence && G.pick && o.presence.pick === G.pick) { const mine = myPeerId(); if (mine && mine > o.peer) { G.pick = null; G.ready = false; sendPresence(true); updateLobby(); showToast('對手先選了這台', 2000); } }
    if (G.ready && o && o.presence && o.presence.ready && o.presence.pick && o.presence.pick !== G.pick && (o.presence.phase === 'lobby' || o.presence.phase === 'count')) startCountdown(false);
    updateTraffic(now / 1000, dt);
    updateMotos(now / 1000, dt);
    updateBoosts(now / 1000, dt);
    orbit += dt * 0.05;
    camera.position.set(CX + Math.cos(orbit) * 600, 230, CZ + Math.sin(orbit) * 600);
    camera.lookAt(CX, 10, CZ);
    sendPresence(false);
    updateEngineAudio(false, false, false);
    setMirror(false);
    renderer.render(scene, camera); return;
  }

  if (G.phase === 'count') {
    const left = 3 - (now - G.countAt) / 1000, n = Math.ceil(left);
    if (n !== G.lastCount) {
      G.lastCount = n; const c = $('count'); c.hidden = false; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
      if (n > 0) { c.textContent = n; beep(523, 0.18); } else { c.textContent = 'GO!'; beep(1046, 0.4); G.phase = 'race'; G.goAt = now; G.lap = 0; setTimeout(() => $('count').hidden = true, 800); }
    }
  }

  updateTraffic((now - G.countAt) / 1000, dt);
  updateMotos((now - G.countAt) / 1000, dt);
  updateBoosts(now / 1000, dt);
  const ctl = physics(dt);
  updateTurboFx();
  updateEngineAudio(true, ctl.gas, ctl.brake);

  // pose cars (drift: visual-only yaw into the turn and a 0.3 m hop at the start; the camera still follows me.h)
  const mine = CARS[G.pick], other = opp.seen && !G.solo ? CARS[opp.car] : null;
  const hopY = DRIFT.hop < DRIFT_HOP ? 0.3 * Math.sin(Math.PI * DRIFT.hop / DRIFT_HOP) : 0;
  poseCar(mine, me.x, me.y + hopY, me.z, me.h - DRIFT.vis, me.pitch, -ctl.steer * 0.45, me.v * dt);
  mine.root.visible = VIEW !== 'cockpit';
  updateDriftFx(dt, mine);
  // only my car and the opponent's car are shown; every other car root is hidden
  for (const t of CAR_KEYS) {
    const c = CARS[t];
    if (c === mine) continue;
    c.root.visible = c === other;
    if (c === other) poseCar(c, opp.x, opp.y, opp.z, opp.h - opp.dv, opp.pitch, -opp.steer * 0.45, opp.v * dt);
  }

  // camera
  if (VIEW === 'cockpit') {
    // driver's seat: the car's eye point, looking down the car's nose (camera -Z is car +Z), tilted slightly down
    updateCockpit(G.pick, ctl.steer, dt);
    mine.root.updateMatrixWorld(true);
    camera.position.copy(COCK[G.pick].eye).applyMatrix4(mine.root.matrixWorld).add(FX.shake);
    camera.quaternion.copy(mine.root.getWorldQuaternion(CK_Q)).multiply(CK_TURN).multiply(CK_PITCH);
  } else {
    const fx = Math.sin(me.h), fz = Math.cos(me.h), back = 9.5;
    // smooth the camera offset relative to the car (not world position), so the distance never grows with speed
    tmp.set(-fx * back, 4.6, -fz * back);
    if (camInit) { camPos.copy(tmp); camLook.set(0, 2.2, 0); camInit = false; }
    camPos.lerp(tmp, 1 - Math.exp(-5 * dt));
    camLook.lerp(new THREE.Vector3(fx * 9, 2.4, fz * 9), 1 - Math.exp(-8 * dt));
    camera.position.set(me.x + camPos.x, Math.max(me.y + camPos.y, me.y + 2.5), me.z + camPos.z).add(FX.shake);
    camera.lookAt(me.x + camLook.x, me.y + camLook.y, me.z + camLook.z);
  }
  const fov = 62; if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }

  // HUD
  $('kmh').textContent = Math.round(Math.abs(me.v) * 3.6);
  $('speed').classList.toggle('boost', performance.now() < boostUntil);
  $('lap').textContent = `第 ${clamp(G.lap, 1, LAPS)}/${LAPS} 圈`;
  if (!G.solo) {
    const rk = $('rank');
    let first = true;
    if (opp.seen) {
      if (opp.fin != null && G.fin == null) first = false;
      else if (G.fin == null) first = (G.lap * N + me.idx) >= (opp.lap * N + opp.idx);
    }
    rk.hidden = !opp.seen; rk.textContent = first ? '第 1 名' : '第 2 名'; rk.classList.toggle('first', first);
  }
  drawMap();
  sendPresence(false);
  if (G.phase === 'done' && !$('result').hidden) fillResult(op);
  setMirror($('result').hidden);
  if (mirrorShown) renderMirror();
  renderer.render(scene, camera);
  if (VIEW === 'cockpit') { // dashboard and hands drawn over the 3D view
    if (cockpitCam.fov !== camera.fov || cockpitCam.aspect !== camera.aspect) { cockpitCam.fov = camera.fov; cockpitCam.aspect = camera.aspect; cockpitCam.updateProjectionMatrix(); }
    renderer.autoClear = false; renderer.clearDepth(); renderer.render(cockpitScene, cockpitCam); renderer.autoClear = true;
  }
  if (mirrorShown) drawMirror();
}

function showResult() {
  $('result').hidden = false; $('controls').hidden = true;
  const p = (getOpp() || {}).presence; fillResult(p);
  if (G.mode === 'story') storyResult(!(p && typeof p.fin === 'number' && p.fin < G.fin)); // won = finished before the computer
}
function fillResult(p) {
  const oFin = !G.solo && p && typeof p.fin === 'number' ? p.fin : null;
  const oRacing = !G.solo && p && p.phase === 'race';
  let title = '抵達終點！好厲害！';
  if (!G.solo && (oFin !== null || oRacing)) title = (oFin !== null && oFin < G.fin) ? '第 2 名！好棒，再挑戰一次！' : '第 1 名！好厲害！';
  if ($('resTitle').textContent !== title) $('resTitle').textContent = title;
  let html = `你的時間　${fmt(G.fin)}`;
  if (!G.solo) html += oFin !== null ? `<br>對手時間　${fmt(oFin)}` : (oRacing ? '<br>對手還在路上，再等一下下！' : '');
  if ($('resTimes').innerHTML !== html) $('resTimes').innerHTML = html;
}

/* ---------------- story mode: 3 chapters; progress in localStorage (every access guarded); lines from story_draft.md ---------------- */
const STORY = {
  open: [['旁白', '山上有一條傳說中的山路，跑贏所有高手的人，就是「山路之王」！'], ['阿力', '我終於有自己的車了！我要變成山路之王！']],
  ch: {
    1: { title: '山腳下的挑戰', opp: '阿虎哥', level: 'easy',
      pre: [['阿虎哥', '喲，新來的？這座山我最熟了，你追不上我啦！'], ['阿力', '比了才知道！'], ['提示', '按「油門」往前衝，彎道前記得「煞車」喔！']],
      win: [['阿虎哥', '哇！你怎麼這麼快？……下次我一定贏回來！'], ['阿虎哥', '聽說中間那段山路，有個超會甩尾的高手，你敢去嗎？']],
      lose: [['阿虎哥', '哈哈，我贏了！不過你很有天分，再來一次吧！']] },
    2: { title: '彎道大師', opp: '飄移姐姐', level: 'normal',
      pre: [['飄移姐姐', '你就是打敗阿虎的阿力？讓我看看你過彎的本事！'], ['飄移姐姐', '教你一招：轉彎時按住「甩尾」，冒出藍火、再變橘火，放開就會衝刺！'], ['阿力', '藍火、橘火……我記住了！']],
      win: [['飄移姐姐', '好漂亮的甩尾！你已經比我厲害了。'], ['飄移姐姐', '最後一關是「極限山路」，那裡住著最強的車手……雷霆。小心！']],
      lose: [['飄移姐姐', '差一點點！記得彎道用甩尾，你一定可以的！']] },
    3: { title: '極限山路', opp: '雷霆', level: 'hard',
      pre: [['雷霆', '……又一個想當山路之王的小鬼。'], ['阿力', '我是阿力！我要挑戰你！'], ['雷霆', '路上的黃色箭頭可以加速。不過，你追不上我的。']],
      win: [['雷霆', '……從來沒有人贏過我。阿力，你才是真正的山路之王。']],
      lose: [['雷霆', '還不夠快。練好了再來找我。'], ['阿力', '我不會放棄的！']] }
  }
};
const STORY_KEY = 'mtnrace.story';
let storyCh = 0, storyLosses = 0, dlgLines = null, dlgI = 0, dlgDone = null;
function storyLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(STORY_KEY));
    if (s && typeof s === 'object') return { unlocked: [1, 2, 3].includes(s.unlocked) ? s.unlocked : 1, cleared: s.cleared === true, introSeen: s.introSeen === true, lastCar: CAR_KEYS.includes(s.lastCar) ? s.lastCar : null };
  } catch (_) {}
  return { unlocked: 1, cleared: false, introSeen: false };
}
function storySave(p) { try { localStorage.setItem(STORY_KEY, JSON.stringify(p)); } catch (_) {} }
const storyFactor = () => Math.max(0.85, 1 - 0.05 * storyLosses); // each loss slows the computer 5%, down to 85%
const storyUrl = ch => '?track=' + ch + '&mode=story&ch=' + ch + (DBG ? '&debug=1' : '');

// dialog: one line per click (or tap anywhere); 跳過 ends it at once
function playDialog(lines, onDone) { dlgLines = lines; dlgI = 0; dlgDone = onDone; $('dialog').hidden = false; showDlgLine(); }
function showDlgLine() { $('dlgSpeaker').textContent = dlgLines[dlgI][0]; $('dlgText').textContent = dlgLines[dlgI][1]; }
function endDlg() { const f = dlgDone; dlgLines = null; dlgDone = null; $('dialog').hidden = true; if (f) f(); }
function nextDlg() { if (!dlgLines) return; if (++dlgI < dlgLines.length) showDlgLine(); else endDlg(); }
$('dialog').addEventListener('click', nextDlg);
$('dlgSkip').addEventListener('click', e => { e.stopPropagation(); endDlg(); });

function openStoryMenu() {
  const p = storyLoad();
  for (const ch of [1, 2, 3]) {
    const locked = ch > p.unlocked, b = $('stc-' + ch);
    b.disabled = locked;
    b.textContent = (locked ? '🔒 ' : '') + `第 ${ch} 關　${STORY.ch[ch].title}／${TRACKS[ch].label}／對手：${STORY.ch[ch].opp}`;
  }
  $('storyBadge').hidden = !p.cleared;
  $('menu').hidden = true; $('storyMenu').hidden = false;
}
function storyStart(ch) {
  storyCh = ch; const p = storyLoad(), c = STORY.ch[ch];
  $('menu').hidden = true;
  const enter = () => enterMode('story');
  if (ch === 1 && !p.introSeen) playDialog(STORY.open.concat(c.pre), () => { storySave(Object.assign(p, { introSeen: true })); enter(); });
  else playDialog(c.pre, enter);
}
function storyResult(win) {
  const p = storyLoad();
  if (win) { p.unlocked = Math.max(p.unlocked, Math.min(3, storyCh + 1)); if (storyCh === 3) p.cleared = true; storySave(p); }
  $('againBtn').hidden = $('resMenuBtn').hidden = true; $('storyResRow').hidden = true;
  playDialog(win ? STORY.ch[storyCh].win : STORY.ch[storyCh].lose, () => storyEndButtons(win));
}
function storyEndButtons(win) {
  const clear = win && storyCh === 3;
  $('storyClear').hidden = !clear; $('resTitle').hidden = clear; $('resTimes').hidden = clear;
  $('storyNextBtn').hidden = !win || clear; $('storyRetryBtn').hidden = win; $('storyChBtn').hidden = clear; $('storyClearBtn').hidden = !clear;
  $('storyResRow').hidden = false;
}
function storyFinish(win) { // DBG test hook: end the race as if it was won or lost
  if (G.fin == null) G.fin = +((performance.now() - G.goAt) / 1000).toFixed(1);
  AI.fin = win ? null : Math.max(0.1, G.fin - 1);
  if (AI.presence) AI.presence.fin = AI.fin; // showResult reads the presence before the next frame refreshes it
  G.phase = 'done'; showResult();
}
$('modeStory').addEventListener('click', () => { initAudio(); openStoryMenu(); });
$('storyBackBtn').addEventListener('click', () => { $('storyMenu').hidden = true; $('menu').hidden = false; });
for (const ch of [1, 2, 3]) $('stc-' + ch).addEventListener('click', () => { location.href = storyUrl(ch); });
$('storyGoBtn').addEventListener('click', () => { initAudio(); if (!G.pick) return; G.ready = true; const p = storyLoad(); startAI(STORY.ch[storyCh].level, storyFactor(), p.lastCar); p.lastCar = AI.car; storySave(p); });
$('storyLobBtn').addEventListener('click', () => { initAudio(); backToMenu(); openStoryMenu(); });
$('storyNextBtn').addEventListener('click', () => { location.href = storyUrl(storyCh + 1); });
$('storyRetryBtn').addEventListener('click', () => { storyLosses++; $('againBtn').click(); });
$('storyChBtn').addEventListener('click', () => { $('againBtn').click(); backToMenu(); openStoryMenu(); });
$('storyClearBtn').addEventListener('click', () => { $('againBtn').click(); backToMenu(); });

requestAnimationFrame(frame);
updateLobby();
if (DBG) window.__race = { G, me, opp, AI, startAI, trackAt, TRACK_LEN, N, storyFinish, storyProg: storyLoad };
const autoCode = new URLSearchParams(location.search).get('join');
if (autoCode && /^\d{4}$/.test(autoCode)) {
  const u = new URL(location.href); u.searchParams.delete('join'); history.replaceState(null, '', u.pathname + u.search);
  enterMode('net');
  joinRoom(autoCode);
} else {
  const sp = new URLSearchParams(location.search), m = sp.get('mode') || (DBG ? 'solo' : '');
  if (m === 'solo' || m === 'net') enterMode(m); // otherwise the main menu stays up
  else if (m === 'story') {
    const ch = Number(sp.get('ch'));
    if (Number.isInteger(ch) && ch >= 1 && ch <= 3 && ch === TRACK_ID && ch <= storyLoad().unlocked) storyStart(ch);
    else openStoryMenu(); // locked or missing chapter: show the chapter select
  }
}
})();
