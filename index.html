<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>晴天山路兜風</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas; sticker-style HUD pinned to the corners; lobby floats over a slow flyover of the valley */
:root{
  --sky:#5fb3ee; --papaya:#ff7a00; --navy:#0b2a5b; --dora:#1ea5ec;
  --cream:#fffaf0; --grass:#4f9a3a; --ink:#0b2a5b; --shade:rgba(11,42,91,.28);
  --f-display:'Baloo 2','PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-body:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-body)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;touch-action:none}
#game canvas{display:block;width:100%;height:100%}
.sticker{background:var(--cream);border:3px solid var(--navy);border-radius:16px;box-shadow:0 4px 0 var(--navy)}
button{font-family:var(--f-display);cursor:pointer;color:var(--navy)}
button:focus-visible{outline:3px solid var(--papaya);outline-offset:3px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#speed{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));padding:4px 14px 2px;display:flex;align-items:baseline;gap:6px}
#speed b{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
#speed span{font-family:var(--f-display);font-size:15px}
#info{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(78px + env(safe-area-inset-top,0px));display:flex;gap:8px}
#info div{padding:2px 12px;font-family:var(--f-display);font-size:18px}
#rank.first{background:#ffd43b}
#mapwrap{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));padding:6px}
#minimap{display:block;width:120px;height:120px}
#music{pointer-events:auto;position:absolute;right:calc(150px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));font-size:15px;padding:6px 12px}
#count{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;font-size:120px;color:#fff;-webkit-text-stroke:5px var(--navy);text-shadow:0 7px 0 var(--navy);pointer-events:none}
#count.pop{animation:pop .5s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1.8);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#toast{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:4px 14px;font-family:var(--f-display);font-size:17px}

/* touch controls */
#controls{position:fixed;inset:0;pointer-events:none}
#steerZone{position:absolute;left:0;top:30%;bottom:0;width:45%;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.8);transform:translate(-50%,-50%);left:calc(110px + env(safe-area-inset-left,0px));bottom:0;top:auto}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:var(--cream);border:3px solid var(--navy);box-shadow:0 3px 0 var(--navy)}
#stick .arrow{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-size:26px;color:#fff;text-shadow:0 2px 0 var(--navy)}
#stick .l{left:8px} #stick .r{right:8px}
.pad{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:4px solid var(--navy);box-shadow:0 6px 0 var(--navy);font-family:var(--f-display);font-weight:800;display:grid;place-items:center;line-height:1.05;text-align:center}
.pad.on{transform:translateY(5px);box-shadow:0 1px 0 var(--navy)}
#gas{width:136px;height:136px;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));background:#4fd36a;font-size:28px}
#brake{width:76px;height:76px;right:calc(178px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));background:#ff6b6b;font-size:19px}
#hornBtn{width:66px;height:66px;right:calc(172px + env(safe-area-inset-right,0px));bottom:calc(116px + env(safe-area-inset-bottom,0px));background:#ffd43b;font-size:17px}

/* lobby + result */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(95,179,238,.15),rgba(11,42,91,.35))}
.panel{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:640px;width:100%}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vh,46px);line-height:1;color:#fff;-webkit-text-stroke:2px var(--navy);text-shadow:0 4px 0 var(--navy);text-wrap:balance;letter-spacing:.02em}
.netbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#netRow{gap:8px;flex-wrap:nowrap}
#codeIn{width:6.5em;font-family:var(--f-display);font-size:18px;padding:3px 8px;text-align:center;color:var(--navy);-webkit-user-select:text;user-select:text;box-shadow:0 3px 0 var(--navy)}
#status.code{font-family:var(--f-display);font-size:20px;background:#ffd43b}
#status{padding:4px 14px;font-size:15px;font-weight:600;text-align:center}
.cars{display:flex;gap:14px;width:100%}
.car{flex:1;min-width:0;padding:8px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;background:var(--cream)}
.car svg{width:100%;max-width:220px;height:auto;max-height:22vh}
.car .name{font-family:var(--f-display);font-size:20px;line-height:1.1}
.car .tag{position:absolute;top:-12px;right:10px;padding:0 10px;border-radius:10px;font-family:var(--f-display);font-size:15px;border:2px solid var(--navy)}
.car.mine{background:#fff3d6;border-color:var(--papaya);box-shadow:0 4px 0 var(--papaya)}
.car.mine .tag{background:var(--papaya);color:#fff}
.car.theirs{opacity:.62}
.car.theirs .tag{background:var(--dora);color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{font-size:22px;padding:6px 26px;background:#4fd36a}
.big:disabled{background:#cfd6df;color:#6b7a90;box-shadow:0 4px 0 #6b7a90;border-color:#6b7a90}
.alt{font-size:16px;padding:6px 16px}
#result .panel{gap:12px}
#resTitle{font-size:clamp(32px,8vh,56px)}
#resTimes{padding:8px 18px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;line-height:1.6}
#rotate{position:fixed;inset:0;background:var(--sky);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px}
#rotate .phone{width:70px;height:120px;border:6px solid var(--navy);border-radius:14px;background:var(--cream);animation:turn 1.6s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate p{font-family:var(--f-display);font-size:24px;margin:0}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
@media (max-height:420px){
  .panel{gap:7px} h1{font-size:28px}
  #speed b{font-size:36px} #gas{width:118px;height:118px;font-size:24px}
  #brake{right:calc(156px + env(safe-area-inset-right,0px))} #hornBtn{right:calc(150px + env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px))}
  #minimap{width:96px;height:96px} #music{right:calc(124px + env(safe-area-inset-right,0px))}
  .car svg{max-height:18vh} #count{font-size:96px}
}
@media (prefers-reduced-motion:reduce){#count.pop,#rotate .phone{animation:none}}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" hidden>
  <div id="speed" class="sticker"><b id="kmh">0</b><span>km/h</span></div>
  <div id="info"><div id="lap" class="sticker">第 1/2 圈</div><div id="rank" class="sticker" hidden>第 1 名</div></div>
  <div id="mapwrap" class="sticker"><canvas id="minimap" width="240" height="240"></canvas></div>
  <button id="music" class="sticker" type="button">音樂 開</button>
  <div id="toast" class="sticker" hidden></div>
  <div id="count" hidden></div>
</div>

<div id="controls" hidden>
  <div id="steerZone"><div id="stick"><span class="arrow l">◀</span><span class="arrow r">▶</span><div id="knob"></div></div></div>
  <div id="hornBtn" class="pad">叭叭</div>
  <div id="brake" class="pad">煞車</div>
  <div id="gas" class="pad">油門</div>
</div>

<div id="lobby" class="overlay">
  <div class="panel">
    <h1>晴天山路兜風</h1>
    <div class="netbar">
      <div id="status" class="sticker">按「開房間」拿到房號，或輸入對方的房號</div>
      <div class="row" id="netRow">
        <button id="hostBtn" class="alt sticker" type="button">開房間</button>
        <input id="codeIn" class="sticker" type="tel" inputmode="numeric" maxlength="4" placeholder="輸入房號" autocomplete="off">
        <button id="joinBtn" class="alt sticker" type="button">加入</button>
      </div>
    </div>
    <div class="cars">
      <button class="car sticker" id="pick-f1" type="button" data-car="f1">
        <span class="tag" hidden></span>
        <svg viewBox="0 0 220 80" aria-hidden="true">
          <rect x="18" y="20" width="12" height="30" rx="2" fill="#0b2a5b"/>
          <rect x="10" y="16" width="36" height="8" rx="2" fill="#0b2a5b"/>
          <path d="M28 52 L60 38 L96 36 L112 22 L132 22 L140 36 L196 44 L208 54 L204 58 L30 58 Z" fill="#ff7a00" stroke="#0b2a5b" stroke-width="3" stroke-linejoin="round"/>
          <path d="M60 46 L150 44 L196 50" stroke="#0b2a5b" stroke-width="6" fill="none" stroke-linecap="round"/>
          <circle cx="122" cy="26" r="8" fill="#fff" stroke="#0b2a5b" stroke-width="3"/>
          <rect x="186" y="56" width="30" height="6" rx="2" fill="#0b2a5b"/>
          <circle cx="52" cy="58" r="16" fill="#222" /><circle cx="52" cy="58" r="6" fill="#ff7a00"/>
          <circle cx="172" cy="60" r="13" fill="#222" /><circle cx="172" cy="60" r="5" fill="#ff7a00"/>
        </svg>
        <span class="name">橘藍 F1 賽車</span>
      </button>
      <button class="car sticker" id="pick-bug" type="button" data-car="bug">
        <span class="tag" hidden></span>
        <svg viewBox="0 0 220 80" aria-hidden="true">
          <path d="M22 60 C22 40 40 36 58 34 C70 10 140 6 158 32 C180 34 198 42 200 60 Z" fill="#1ea5ec" stroke="#0b2a5b" stroke-width="3" stroke-linejoin="round"/>
          <path d="M74 34 C84 18 132 14 146 33 Z" fill="#bfe9ff" stroke="#0b2a5b" stroke-width="3" stroke-linejoin="round"/>
          <line x1="110" y1="18" x2="110" y2="34" stroke="#0b2a5b" stroke-width="3"/>
          <circle cx="190" cy="46" r="6" fill="#fff" stroke="#0b2a5b" stroke-width="2"/>
          <rect x="16" y="56" width="190" height="6" rx="3" fill="#ddd" stroke="#0b2a5b" stroke-width="2"/>
          <circle cx="60" cy="60" r="15" fill="#222"/><circle cx="60" cy="60" r="7" fill="#fff"/>
          <circle cx="164" cy="60" r="15" fill="#222"/><circle cx="164" cy="60" r="7" fill="#fff"/>
        </svg>
        <span class="name">藍色金龜車</span>
      </button>
    </div>
    <div class="row">
      <button id="readyBtn" class="big sticker" type="button" disabled>先選一台車</button>
      <button id="soloBtn" class="alt sticker" type="button" disabled>自己先開</button>
    </div>
  </div>
</div>

<div id="result" class="overlay" hidden>
  <div class="panel">
    <h1 id="resTitle">抵達終點！</h1>
    <div id="resTimes" class="sticker"></div>
    <button id="againBtn" class="big sticker" type="button">再玩一次</button>
  </div>
</div>

<div id="rotate"><div class="phone"></div><p>請把手機轉成橫的</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="model-f1.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="model-beetle.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const N = 700, HALF = 10, LAPS = 2, VMAX = 140 / 3.6, SC = 1.6;
const CX = 10 * SC, CZ = 100 * SC, TW = 960 * SC;
const LX = 10 * SC, LZ = 115 * SC;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const fmt = s => { const m = Math.floor(s / 60); const r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); };

/* ---------------- renderer & scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(innerWidth, innerHeight);
$('game').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 4000);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

(function sky() {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#3f97e0'); gr.addColorStop(0.55, '#8cc8f2'); gr.addColorStop(1, '#dff0fa');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  scene.background = new THREE.CanvasTexture(c);
})();
scene.fog = new THREE.Fog(0xd6ecf7, 380, 2300);
scene.add(new THREE.HemisphereLight(0xcfe9ff, 0x5d8a3c, 0.78));
const sun = new THREE.DirectionalLight(0xfff0d0, 0.95); sun.position.set(300, 420, 160); scene.add(sun);

const M = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));

/* ---------------- track ---------------- */
const ctrl = [[0,0,0],[120,4,-20],[220,10,30],[262,16,140],[205,22,232],[95,26,252],[25,24,192],[-40,18,228],[-140,14,262],[-232,10,182],[-242,6,60],[-172,2,-40],[-82,0,-62]];
const curve = new THREE.CatmullRomCurve3(ctrl.map(p => new THREE.Vector3(p[0] * SC, p[1] * 1.3, p[2] * SC)), true, 'centripetal');
const P = curve.getSpacedPoints(N).slice(0, N);
const T = [], L = [], D = [0];
for (let i = 0; i < N; i++) {
  const a = P[(i - 1 + N) % N], b = P[(i + 1) % N];
  const t = new THREE.Vector3().subVectors(b, a).normalize(); T.push(t);
  const l = new THREE.Vector3(t.z, 0, -t.x).normalize(); L.push(l);
  if (i > 0) D.push(D[i - 1] + P[i].distanceTo(P[i - 1]));
}
const TRACK_LEN = D[N - 1] + P[N - 1].distanceTo(P[0]);
const yawAt = i => Math.atan2(T[i].x, T[i].z);

function nearestIdx(x, z, from, win) {
  let best = 1e18, bi = 0;
  if (from == null) {
    for (let i = 0; i < N; i += 4) { const dx = x - P[i].x, dz = z - P[i].z, d = dx * dx + dz * dz; if (d < best) { best = d; bi = i; } }
    from = bi; win = 4;
  }
  for (let k = -win; k <= win; k++) { const i = (from + k + N) % N; const dx = x - P[i].x, dz = z - P[i].z, d = dx * dx + dz * dz; if (d < best) { best = d; bi = i; } }
  return { i: bi, d: Math.sqrt(best) };
}
function noise(x, z) {
  return Math.sin(x * 0.031) * Math.cos(z * 0.027) * 0.6 + Math.sin(x * 0.071 + z * 0.053) * 0.3 + Math.cos(x * 0.013 - z * 0.019) * 0.5;
}
function heightAt(x, z) {
  const n = nearestIdx(x, z);
  const y0 = P[n.i].y, t = ss(HALF + 3, HALF + 45, n.d);
  const lake = 30 * Math.exp(-((x - LX) ** 2 + (z - LZ) ** 2) / (62 * SC * 62 * SC));
  const r = Math.hypot(x - CX, z - CZ);
  const mount = ss(300 * SC, 470 * SC, r) * 95;
  return { h: y0 - 0.35 + t * (noise(x, z) * 13 + 0.35 - lake + mount), d: n.d };
}

// road texture
function roadTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#5b5f66'; g.fillRect(0, 0, 256, 512);
  for (let k = 0; k < 2600; k++) { const v = 80 + Math.random() * 40 | 0; g.fillStyle = `rgb(${v},${v + 2},${v + 6})`; g.fillRect(Math.random() * 256, Math.random() * 512, 2, 2); }
  g.fillStyle = '#f4f4f4'; g.fillRect(8, 0, 9, 512); g.fillRect(239, 0, 9, 512);
  g.fillStyle = '#ffcf33'; g.fillRect(122, 0, 12, 256);
  const tx = new THREE.CanvasTexture(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  tx.anisotropy = renderer.capabilities.getMaxAnisotropy(); return tx;
}
(function buildRoad() {
  const pos = [], uv = [], idx = [], skirt = [], sIdx = [];
  for (let k = 0; k <= N; k++) {
    const i = k % N, p = P[i], l = L[i], v = (k === N ? TRACK_LEN : D[i]) / 18;
    pos.push(p.x + l.x * HALF, p.y + 0.03, p.z + l.z * HALF, p.x - l.x * HALF, p.y + 0.03, p.z - l.z * HALF);
    uv.push(0, v, 1, v);
    const e = HALF + 0.4;
    skirt.push(p.x + l.x * e, p.y + 0.02, p.z + l.z * e, p.x + l.x * e, p.y - 4, p.z + l.z * e,
               p.x - l.x * e, p.y + 0.02, p.z - l.z * e, p.x - l.x * e, p.y - 4, p.z - l.z * e);
    if (k < N) {
      const a = k * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      const s = k * 4; sIdx.push(s, s + 4, s + 1, s + 1, s + 4, s + 5, s + 2, s + 3, s + 6, s + 3, s + 7, s + 6);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, M(0xffffff, { map: roadTexture(), side: THREE.DoubleSide })));
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(skirt, 3)); sg.setIndex(sIdx); sg.computeVertexNormals();
  scene.add(new THREE.Mesh(sg, M(0x8a7a5e, { side: THREE.DoubleSide })));
  // shoulders (light sand strip outside the white line)
  const sh = [], shI = [];
  for (let k = 0; k <= N; k++) {
    const i = k % N, p = P[i], l = L[i];
    for (const sgn of [1, -1]) {
      sh.push(p.x + l.x * sgn * HALF, p.y + 0.02, p.z + l.z * sgn * HALF, p.x + l.x * sgn * (HALF + 0.4), p.y + 0.02, p.z + l.z * sgn * (HALF + 0.4));
    }
    if (k < N) { const a = k * 4; shI.push(a, a + 4, a + 1, a + 1, a + 4, a + 5, a + 2, a + 3, a + 6, a + 3, a + 7, a + 6); }
  }
  const shg = new THREE.BufferGeometry(); shg.setAttribute('position', new THREE.Float32BufferAttribute(sh, 3)); shg.setIndex(shI); shg.computeVertexNormals();
  scene.add(new THREE.Mesh(shg, M(0xc9b48a, { side: THREE.DoubleSide })));
})();

// guardrails
(function rails() {
  const pos = [], idx = []; const e = HALF + 0.9;
  for (let k = 0; k <= N; k++) {
    const i = k % N, p = P[i], l = L[i];
    for (const s of [1, -1]) { const x = p.x + l.x * e * s, z = p.z + l.z * e * s; pos.push(x, p.y + 0.5, z, x, p.y + 0.85, z); }
    if (k < N) { const a = k * 4; idx.push(a, a + 4, a + 1, a + 1, a + 4, a + 5, a + 2, a + 3, a + 6, a + 3, a + 7, a + 6); }

  $('rank').hidden = solo; camInit = true; resetStick();
  try { const el = document.documentElement; if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {}); } catch (_) {}
  sendPresence(true);
}

function showToast(text, ms) { const t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(showToast.h); showToast.h = setTimeout(() => t.hidden = true, ms || 1500); }

/* ---------------- minimap ---------------- */
const mm = $('minimap'), mctx = mm.getContext('2d');
let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
P.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); });
const mScale = 200 / Math.max(maxX - minX, maxZ - minZ);
const mx = x => 120 + (x - (minX + maxX) / 2) * -mScale, mz = z => 120 + (z - (minZ + maxZ) / 2) * -mScale;
function drawMap() {
  mctx.clearRect(0, 0, 240, 240);
  mctx.lineJoin = 'round'; mctx.beginPath(); P.forEach((p, i) => i ? mctx.lineTo(mx(p.x), mz(p.z)) : mctx.moveTo(mx(p.x), mz(p.z))); mctx.closePath();
  mctx.strokeStyle = '#0b2a5b'; mctx.lineWidth = 14; mctx.stroke(); mctx.strokeStyle = '#9aa7b8'; mctx.lineWidth = 8; mctx.stroke();
  mctx.fillStyle = '#fff'; mctx.fillRect(mx(P[0].x) - 6, mz(P[0].z) - 3, 12, 6);
  const dot = (x, z, c, r) => { mctx.beginPath(); mctx.arc(mx(x), mz(z), r, 0, 7); mctx.fillStyle = c; mctx.fill(); mctx.lineWidth = 3; mctx.strokeStyle = '#0b2a5b'; mctx.stroke(); };
  TR.forEach(c => dot(c.x, c.z, '#c3cbd6', 6));
  if (opp.seen && opp.car) dot(opp.x, opp.z, opp.car === 'f1' ? '#ff7a00' : '#1ea5ec', 8);
  dot(me.x, me.z, G.pick === 'f1' ? '#ff7a00' : '#1ea5ec', 11);
}

/* ---------------- loop ---------------- */
let last = performance.now(), camInit = true, orbit = 0;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tmp = new THREE.Vector3();

function physics(dt) {
  const racing = G.phase === 'race';
  const finished = G.phase === 'done';
  let gas = racing && input.gas, brake = racing && input.brake, steer = racing || finished ? input.steer : 0;
  if (finished) { gas = false; brake = me.v > 6; }
  if (gas) me.v += 11 * (1 - 0.85 * me.v / VMAX) * dt; if (me.v > VMAX) me.v = VMAX;
  else if (brake) { me.v -= (me.v > 0 ? 22 : 4) * dt; if (me.v < -5) me.v = -5; }
  else { me.v -= Math.sign(me.v) * Math.min(Math.abs(me.v), 2.6 * dt); }
  const n = nearestIdx(me.x, me.z, me.idx, 18); const i = n.i;
  const ht = yawAt(i), off = angDiff(ht, me.h);
  const sp = Math.abs(me.v);
  const yawRate = (1.15 - 0.45 * sp / VMAX) * Math.min(1, sp / 4) * Math.sign(me.v || 1);
  me.h -= steer * yawRate * dt;
  if (Math.abs(steer) < 0.15 && sp > 2 && Math.abs(off) < 1.0 && me.v > 0) me.h += off * 0.9 * dt; // gentle auto-steer
  me.x += Math.sin(me.h) * me.v * dt; me.z += Math.cos(me.h) * me.v * dt;
  hitTraffic();
  // stay on the road
  const n2 = nearestIdx(me.x, me.z, i, 6), j = n2.i;
  const dx = me.x - P[j].x, dz = me.z - P[j].z;
  const lat = dx * L[j].x + dz * L[j].z, lim = HALF - CARS[G.pick].half * 0.85;
  if (Math.abs(lat) > lim) {
    const push = lat - Math.sign(lat) * lim; me.x -= L[j].x * push; me.z -= L[j].z * push;
    me.v *= 1 - 1.4 * dt; if (me.v > 0) me.h += angDiff(yawAt(j), me.h) * 2.2 * dt;
  }
  // bump the other car softly
  if (opp.seen) {
    const ox = me.x - opp.x, oz = me.z - opp.z, d = Math.hypot(ox, oz);
    const R2 = (CARS.f1.half + CARS.bug.half) * 1.1;
    if (d < R2 && d > 0.01 && Math.abs(me.y - opp.y) < 3) { const k = (R2 - d) / d; me.x += ox * k * 0.6; me.z += oz * k * 0.6; me.v *= 1 - 0.8 * dt; }
  }
  // height & pitch
  const a = P[j], b = P[(j + 1) % N]; const seg = a.distanceTo(b);
  const along = clamp(((me.x - a.x) * T[j].x + (me.z - a.z) * T[j].z) / seg, -1, 1);
  me.y = a.y + (b.y - a.y) * along;
  const slope = (b.y - a.y) / seg, fwdSlope = slope * Math.cos(angDiff(me.h, yawAt(j)));
  me.pitch += (-Math.atan(fwdSlope) - me.pitch) * Math.min(1, 8 * dt);
  // laps
  const prev = me.idx; me.idx = j;
  if (prev > N * 0.75 && j < N * 0.25) { G.lap++; if (racing && G.lap > 1 && G.lap <= LAPS) showToast('最後一圈！加油！', 1800); }
  else if (prev < N * 0.25 && j > N * 0.75) G.lap--;
  if (racing && G.lap > LAPS) {
    G.phase = 'done'; G.fin = +((performance.now() - G.goAt) / 1000).toFixed(1); sendPresence(true);
    beep(784, 0.15); setTimeout(() => beep(1046, 0.3), 160);
    setTimeout(showResult, 1200);
  }
  return { steer, gas, brake };
}

function readOpp(dt) {
  const o = getOpp(), p = o && o.presence;
  if (!p || !p.pick || !p.st || p.phase === 'lobby' || G.phase === 'lobby') {
    opp.seen = false;
  } else {
    const st = p.st;
    if (!opp.seen || opp.car !== p.pick) { Object.assign(opp, { x: st[0], y: st[1], z: st[2], h: st[3] }); }
    opp.seen = true; opp.car = p.pick;
    const k = Math.min(1, 10 * dt);
    opp.x += (st[0] - opp.x) * k; opp.y += (st[1] - opp.y) * k; opp.z += (st[2] - opp.z) * k;
    opp.h += angDiff(st[3], opp.h) * k; opp.v = st[4]; opp.pitch = st[5] || 0; opp.steer = st[6] || 0;
    opp.lap = p.lap; opp.idx = p.idx; opp.fin = p.fin;
  }
  if (p && typeof p.horn === 'number') {
    if (opp.horn !== null && p.horn > opp.horn && G.phase !== 'lobby') {
      const d = opp.seen ? Math.hypot(opp.x - me.x, opp.z - me.z) : 60; horn(clamp(1.2 - d / 120, 0.25, 1));
      showToast('對手按喇叭：叭叭！', 1200);
    }
    opp.horn = p.horn;
  }
  return p;
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  readInput();
  clouds.forEach(c => { c.position.x += dt * 2.5; if (c.position.x > CX + 1100) c.position.x = CX - 1100; });
  const op = readOpp(dt);

  // lobby: conflict + start checks
  if (G.phase === 'lobby') {
    const o = getOpp();
    if (o && o.presence && G.pick && o.presence.pick === G.pick) { const mine = myPeerId(); if (mine && mine > o.peer) { G.pick = null; G.ready = false; sendPresence(true); updateLobby(); } }
    if (G.ready && o && o.presence && o.presence.ready && o.presence.pick && o.presence.pick !== G.pick && (o.presence.phase === 'lobby' || o.presence.phase === 'count')) startCountdown(false);
    updateTraffic(now / 1000, dt);
    orbit += dt * 0.05;
    camera.position.set(CX + Math.cos(orbit) * 600, 230, CZ + Math.sin(orbit) * 600);
    camera.lookAt(CX, 10, CZ);
    sendPresence(false);
    updateEngineAudio(false, false, false);
    renderer.render(scene, camera); return;
  }

  if (G.phase === 'count') {
    const left = 3 - (now - G.countAt) / 1000, n = Math.ceil(left);
    if (n !== G.lastCount) {
      G.lastCount = n; const c = $('count'); c.hidden = false; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
      if (n > 0) { c.textContent = n; beep(523, 0.18); } else { c.textContent = 'GO!'; beep(1046, 0.4); G.phase = 'race'; G.goAt = now; G.lap = 0; setTimeout(() => $('count').hidden = true, 800); }
    }
  }

  updateTraffic((now - G.countAt) / 1000, dt);
  const ctl = physics(dt);
  updateEngineAudio(true, ctl.gas, ctl.brake);

  // pose cars
  const mine = CARS[G.pick], other = CARS[G.pick === 'f1' ? 'bug' : 'f1'];
  poseCar(mine, me.x, me.y, me.z, me.h, me.pitch, -ctl.steer * 0.45, me.v * dt);
  if (opp.seen && !G.solo) { other.root.visible = true; poseCar(other, opp.x, opp.y, opp.z, opp.h, opp.pitch, -opp.steer * 0.45, opp.v * dt); }
  else other.root.visible = false;

  // camera
  const fx = Math.sin(me.h), fz = Math.cos(me.h), back = 9.5;
  tmp.set(me.x - fx * back, me.y + 4.6, me.z - fz * back);
  const ground = me.y + 2.5; if (tmp.y < ground) tmp.y = ground;
  if (camInit) { camPos.copy(tmp); camLook.set(me.x, me.y + 2.2, me.z); camInit = false; }
  camPos.lerp(tmp, 1 - Math.exp(-5 * dt));
  camLook.lerp(new THREE.Vector3(me.x + fx * 9, me.y + 2.4, me.z + fz * 9), 1 - Math.exp(-8 * dt));
  camera.position.copy(camPos); camera.lookAt(camLook);
  const fov = 62; if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }

  // HUD
  $('kmh').textContent = Math.round(Math.abs(me.v) * 3.6);
  $('lap').textContent = `第 ${clamp(G.lap, 1, LAPS)}/${LAPS} 圈`;
  if (!G.solo) {
    const rk = $('rank');
    let first = true;
    if (opp.seen) {
      if (opp.fin != null && G.fin == null) first = false;
      else if (G.fin == null) first = (G.lap * N + me.idx) >= (opp.lap * N + opp.idx);
    }
    rk.hidden = !opp.seen; rk.textContent = first ? '第 1 名' : '第 2 名'; rk.classList.toggle('first', first);
  }
  drawMap();
  sendPresence(false);
  if (G.phase === 'done' && !$('result').hidden) fillResult(op);
  renderer.render(scene, camera);
}

function showResult() { $('result').hidden = false; $('controls').hidden = true; fillResult((getOpp() || {}).presence); }
function fillResult(p) {
  const oFin = !G.solo && p && typeof p.fin === 'number' ? p.fin : null;
  const oRacing = !G.solo && p && p.phase === 'race';
  let title = '抵達終點！好厲害！';
  if (!G.solo && (oFin !== null || oRacing)) title = (oFin !== null && oFin < G.fin) ? '第 2 名！好棒，再挑戰一次！' : '第 1 名！好厲害！';
  if ($('resTitle').textContent !== title) $('resTitle').textContent = title;
  let html = `你的時間　${fmt(G.fin)}`;
  if (!G.solo) html += oFin !== null ? `<br>對手時間　${fmt(oFin)}` : (oRacing ? '<br>對手還在路上，再等一下下！' : '');
  if ($('resTimes').innerHTML !== html) $('resTimes').innerHTML = html;
}

requestAnimationFrame(frame);
updateLobby();
})();
</script>
</body>
</html>
